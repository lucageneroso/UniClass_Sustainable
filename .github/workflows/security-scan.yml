name: Sicurezza Snyk + GitGuardian

on:
  push: 
  pull_request:
    branches: [main, develop] # Inutile scansionare ogni push su branch privati

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_check:
    runs-on: ubuntu-latest
    env:
      ELECTRICITYMAPS_API_KEY: ${{ secrets.ELECTRICITYMAPS_API_KEY }}

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Start Eco-CI Energy Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: start-measurement

       # 2. SCAN SECRET HARDCODED (con GitGuardian)
      - name: GitGuardian Scansione Secret
        if: github.event_name == 'push'
        uses: GitGuardian/ggshield-action@master
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GG_API_KEY }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Debug GG_API_KEY
        run: |
          if [ -z "$GG_API_KEY" ]; then
            echo "GG_API_KEY is NOT set"
            exit 1
          else
            echo "GG_API_KEY is set"
            fi
        env:
          GG_API_KEY: ${{ secrets.GG_API_KEY }}


      - name: Compilazione e Installazione (Senza Esecuzione Test)
        # CORREZIONE: Rimosso -Dmaven.main.skip=true. 
        # Ora compila correttamente src/main/java rendendo le classi visibili.
        # -DskipTests evita di eseguire i test, ma li compila.
        run: mvn -B install -DskipTests

      # 1. SCAN VULNERABILITÀ (DAST/SAST con Snyk)
      # Installa la CLI di Snyk sul runner (dove Java 21 è già presente)
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

     

      - name: Measure Build Energy
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: get-measurement
          label: 'Security Scan'

      - name: Final Energy & CO2 Report^
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: display-results
