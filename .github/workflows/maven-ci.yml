name: Java CI con Maven

on:
  push:
    branches:
      - main
      - develop
      - lucagen
      - prototype
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - prototype
      - lucagen

jobs:
  build:
    runs-on: ubuntu-latest

    #  Variabile d’ambiente per Eco-CI (CO₂)
    env:
      ELECTRICITYMAPS_API_KEY: ${{ secrets.ELECTRICITYMAPS_API_KEY }}

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    #  1. AVVIO MISURAZIONE ECO-CI
    - name: Start Eco-CI Energy Measurement
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: start-measurement

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build, Test ed Esecuzione LoginServletTest
      run: mvn -B clean package --file pom.xml

    - name: Upload del JAR/WAR di Build (Artefatto)
      uses: actions/upload-artifact@v4
      with:
        name: uni-class-build
        path: target/UniClass-Dependability.war

    # 2. STOP MISURAZIONE + RACCOLTA DATI
    - name: Measure Build Energy
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: get-measurement
        label: 'Maven Build & Test'

    #  3. REPORT FINALE (ENERGIA + CO₂)
    - name: Final Energy & CO2 Report
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: display-results

    - name: Upload Report Coverage (JaCoCo)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: target/site/jacoco/
        retention-days: 1
