name: Analisi Statica SonarCloud

on:
  pull_request:
    branches: [main, develop] # Inutile scansionare ogni push su branch privati
    # Si avvia solo quando si cerca di unire il codice in questi branch
   
    
jobs:
  sonar_analysis:
    runs-on: ubuntu-latest
    env:
      ELECTRICITYMAPS_API_KEY: ${{ secrets.ELECTRICITYMAPS_API_KEY }}
    
    steps:
      - name: Checkout del codice (con fetch-depth 0)
        uses: actions/checkout@v4
        with:
          # Necessario per l'analisi differenziale (solo codice modificato) di SonarCloud
          fetch-depth: 0 

      - name: Start Eco-CI Energy Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: start-measurement
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Esecuzione Analisi SonarCloud
        # Lancia lo scanner Maven. Il comando 'verify' esegue i test prima dell'analisi.
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=$SONAR_ORGANIZATION -Dsonar.projectKey=$SONAR_PROJECT_KEY
        env:
          # TOKEN fornito da GitHub per le azioni, necessario per commentare sulla PR
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          # TOKEN nei secrets
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
          
          # Parametri specifici del progetto SonarCloud
         
          SONAR_PROJECT_KEY: JakartaDependent_UniClass-Dependability
          
          SONAR_ORGANIZATION: jakartadependent

      - name: Measure Build Energy
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: get-measurement
          label: 'Security Scan'

      - name: Final Energy & CO2 Report^
        uses: green-coding-solutions/eco-ci-energy-estimation@v4
        with:
          task: display-results
